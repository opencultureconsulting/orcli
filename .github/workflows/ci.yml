name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck src/**/*.sh
        run: |
          shopt -s globstar
          # bashly partials have no shebang (and not all a shellcheck directive)
          shellcheck --shell=bash src/**/*.sh

  bashly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - name: install bashly (same version that generated ./orcli)
        run: gem install bashly -v "$(grep -m 1 -oP 'generated by bashly \K[0-9.]+' orcli)"
      - name: check that ./orcli is up to date with src/
        run: |
          bashly generate --upgrade
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff
            echo "::error::./orcli is not up to date, run 'bashly generate --upgrade' and commit the result"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openrefine: ["3.3", "3.4.1", "3.5.2", "3.6.2", "3.7.9", "3.8.7", "3.9.5", "3.10.1"]
    name: test (OpenRefine ${{ matrix.openrefine }})
    env:
      # tests/import-csv-unicode.sh fails with the POSIX locale
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ORCLI_CACHE: ${{ github.workspace }}/.cache/orcli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: .cache/orcli/openrefine-${{ matrix.openrefine }}
          key: openrefine-${{ matrix.openrefine }}
      - name: run tests
        run: ./test-versions.sh "${{ matrix.openrefine }}"

  test-macos:
    runs-on: macos-latest
    name: test (OpenRefine 3.10.1, macOS)
    env:
      # C.UTF-8 may not exist on macOS
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ORCLI_CACHE: ${{ github.workspace }}/.cache/orcli
    steps:
      - uses: actions/checkout@v4
      - name: install bash (macOS ships Bash 3.2) and jq
        run: |
          brew install bash
          command -v jq || brew install jq
          # orcli uses "#!/usr/bin/env bash", so put Homebrew's bash first in PATH
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: .cache/orcli/openrefine-3.10.1
          key: openrefine-3.10.1-macos
      - name: run tests
        run: |
          bash --version | head -n 1
          ./test-versions.sh 3.10.1
      - name: diagnose UTF-8 (temporary)
        if: failure()
        run: |
          set +e -x
          locale
          command -v curl; curl --version | head -n 1
          s='a⊌"\'; printf '%s' "$s" | od -An -tx1 -c
          source src/lib/json.sh
          grel_string "$s" | od -An -tx1 -c
          s2="${s//\\/\\\\}"; printf '%s' "$s2" | od -An -tx1 -c
          # trace the requests of orcli (curl wrapper)
          mkdir -p "$RUNNER_TEMP/wrap"
          printf '#!/bin/sh\nexec %s --trace-ascii "%s/trace-$$.txt" "$@"\n' "$(command -v curl)" "$RUNNER_TEMP" > "$RUNNER_TEMP/wrap/curl"
          chmod +x "$RUNNER_TEMP/wrap/curl"
          cd "$ORCLI_CACHE/openrefine-3.10.1/tests"
          PATH="$RUNNER_TEMP/wrap:$PATH" ../orcli run --port 3337 export-jsonl-records.sh || true
          for f in $(grep -l "export-rows" "$RUNNER_TEMP"/trace-*.txt); do
            echo "== $f"
            grep -A3 "=> Send data" "$f" | head -n 8
            grep -o '.\{0,40\}%[EeCc8][0-9A-Fa-f].\{0,40\}' "$f" | head -n 20
            grep -c '%E2%8A%8C' "$f"
          done
