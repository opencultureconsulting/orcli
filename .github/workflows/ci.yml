name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck src/**/*.sh
        run: |
          shopt -s globstar
          # bashly partials have no shebang (and not all a shellcheck directive)
          shellcheck --shell=bash src/**/*.sh

  bashly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - name: install bashly (same version that generated ./orcli)
        run: gem install bashly -v "$(grep -m 1 -oP 'generated by bashly \K[0-9.]+' orcli)"
      - name: check that ./orcli is up to date with src/
        run: |
          bashly generate --upgrade
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff
            echo "::error::./orcli is not up to date, run 'bashly generate --upgrade' and commit the result"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openrefine: ["3.3", "3.4.1", "3.5.2", "3.6.2", "3.7.9", "3.8.7", "3.9.5", "3.10.1"]
    name: test (OpenRefine ${{ matrix.openrefine }})
    env:
      # tests/import-csv-unicode.sh fails with the POSIX locale
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ORCLI_CACHE: ${{ github.workspace }}/.cache/orcli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: .cache/orcli/openrefine-${{ matrix.openrefine }}
          key: openrefine-${{ matrix.openrefine }}
      - name: run tests
        run: ./test-versions.sh "${{ matrix.openrefine }}"
